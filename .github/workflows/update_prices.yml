name: Update Prime Prices

on:
  schedule:
    - cron: '0 14 * * *'   # daily at 14 UTC, 7am pst, 6pdt
  workflow_dispatch:        # manual trigger from GitHub

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch warframe prices
        run: python fetch_prices.py

      - name: Fetch weapon prices
        run: python fetch_weapons.py

      - name: Commit updated JSONs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json prices_weapons.json
          git diff --staged --quiet || git commit -m "Update prices $(date -u '+%Y-%m-%d')"
          git push
